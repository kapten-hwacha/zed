name: Build Zed with LaTeX Math

on:
  workflow_dispatch:
  schedule:
    # Run weekly on Sunday at 04:00 UTC
    - cron: '0 4 * * 0'

permissions:
  contents: write

jobs:
  sync-upstream:
    name: Sync Upstream
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync with upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/zed-industries/zed.git || git remote set-url upstream https://github.com/zed-industries/zed.git
          git fetch upstream main

          BEHIND_COUNT=$(git rev-list --count HEAD..upstream/main)
          echo "Upstream is ahead by $BEHIND_COUNT commits."

          if [ "$BEHIND_COUNT" -eq 0 ]; then
            echo "Branch is already up to date with upstream/main. Nothing to merge."
            exit 0
          fi

          echo "Merging upstream/main into main..."
          if git merge upstream/main --no-edit -m "chore(sync): merge upstream/main into main"; then
            echo "Merge successful. Pushing to origin/main..."
            git push origin HEAD:main
          else
            echo "Merge conflict detected! Aborting merge to prevent repository corruption."
            git merge --abort
            exit 1
          fi

  build-macos-arm64:
    name: Build macOS ARM64 Bundle
    needs: sync-upstream
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          submodules: recursive

      - name: Select Xcode 16
        run: |
          for xcode in /Applications/Xcode_16*.app; do
            if [ -d "$xcode" ]; then
              sudo xcode-select -s "$xcode/Contents/Developer"
              break
            fi
          done
          xcodebuild -version

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: aarch64-apple-darwin, wasm32-wasip2, wasm32-unknown-unknown, x86_64-unknown-linux-musl

      - name: Install cargo-bundle
        run: |
          cargo install cargo-bundle --git https://github.com/zed-industries/cargo-bundle.git --branch zed-deploy

      - name: Build macOS Application Bundle (.dmg)
        run: |
          export CXXFLAGS="-stdlib=libc++"
          echo "stable" > crates/zed/RELEASE_CHANNEL
          ./script/generate-licenses
          ./script/bundle-mac aarch64-apple-darwin

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zed-aarch64-math.dmg
          path: target/aarch64-apple-darwin/release/Zed-aarch64.dmg
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/markdown-math-rendering' || github.ref == 'refs/heads/main'
        with:
          tag_name: latest-math
          name: "Zed with Native LaTeX Math (Nightly)"
          body: |
            Custom build of Zed for Apple Silicon macOS with native theme-aware LaTeX math rendering in Markdown preview and AI chat.
            
            Built automatically from branch `${{ github.ref_name }}`.
          files: |
            target/aarch64-apple-darwin/release/Zed-aarch64.dmg
