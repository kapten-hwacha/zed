name: Sync Upstream (Manual)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync with upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/zed-industries/zed.git || git remote set-url upstream https://github.com/zed-industries/zed.git
          git fetch upstream main

          BEHIND_COUNT=$(git rev-list --count HEAD..upstream/main)
          echo "Upstream is ahead by $BEHIND_COUNT commits."

          if [ "$BEHIND_COUNT" -eq 0 ]; then
            echo "Branch is already up to date with upstream/main. Nothing to merge."
            exit 0
          fi

          echo "Merging upstream/main into main..."
          if git merge upstream/main --no-edit -m "chore(sync): merge upstream/main into main"; then
            echo "Merge successful. Pushing to origin/main..."
            git push origin HEAD:main
          else
            echo "Merge conflict detected! Aborting merge to prevent repository corruption."
            git merge --abort
            exit 1
          fi
